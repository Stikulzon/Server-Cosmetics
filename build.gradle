plugins {
	id 'fabric-loom' version "${loom_version}"
    id "com.modrinth.minotaur" version "2.+"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.bawnorton.com/releases" }
	maven { url "https://maven.enjarai.dev/mirrors" }
	maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots' }
	maven { url 'https://maven.nucleoid.xyz' }
	maven { url 'https://jitpack.io' }
	maven { url "https://api.modrinth.com/maven" }
	mavenCentral()
}

fabricApi {
	configureDataGeneration()
}

loom {
    accessWidenerPath = file("src/main/resources/servercosmetics.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.5.0")))
	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

	include (modImplementation ("eu.pb4:sgui:${project.sgui_version}"))
	include (modImplementation ("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))

	include(implementation 'com.github.Carleslc.Simple-YAML:Simple-Yaml:1.8.4')

	include (implementation 'org.xerial:sqlite-jdbc:3.46.0.1')
	include (implementation 'com.j256.ormlite:ormlite-jdbc:6.1')
	include (implementation 'com.j256.ormlite:ormlite-core:6.1')

	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'

	include (implementation("org.json:json:20250107"))

	modImplementation ("eu.pb4:polymer-core:[${polymer_version}]")
	modImplementation ("eu.pb4:polymer-blocks:[${polymer_version}]")
	modImplementation ("eu.pb4:polymer-resource-pack:[${polymer_version}]")
	modImplementation ("eu.pb4:polymer-virtual-entity:[${polymer_version}]")
	modImplementation ("eu.pb4:polymer-autohost:${polymer_version}")

	include(modImplementation "net.kyori:adventure-api:${project.adventure_version}")
	include(modImplementation "net.kyori:adventure-text-serializer-legacy:${project.adventure_version}")
	include(modImplementation "net.kyori:adventure-text-minimessage:${project.adventure_version}")
	include(modImplementation "net.kyori:adventure-platform-fabric:${project.adventure_platform_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }

    processResources.exclude('.cache/**/*')
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}


if (System.getenv("MODRINTH_TOKEN")) {
    modrinth {
        token = System.getenv("MODRINTH")
        projectId = 'rpTNWjZH'// This can be the project ID or the slug. Either will work!
        versionNumber = "" + version
        versionType = "release" // This is the default -- can also be `beta` or `alpha`
        uploadFile = remapJar
        gameVersions = [((String) project.minecraft_version)]
        changelog = System.getenv("CHANGELOG")
        loaders = ["fabric"]

        dependencies {
            required.project "polymer"
        }

        syncBodyFrom = rootProject.file("README.md").text
        tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
    }
    remapJar {
        finalizedBy project.tasks.modrinth
    }
}
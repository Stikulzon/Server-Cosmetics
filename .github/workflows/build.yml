name: Build and Format Check

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
    branches:
      - "**"
  push:
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Oxipng
        run: |
          sudo apt-get update
          sudo apt-get install -y oxipng

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compress PNGs
        run: oxipng -o max -s -a -r src

      - name: Check Formatting
        run: ./gradlew spotlessCheck

      - name: Build
        run: ./gradlew build

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/